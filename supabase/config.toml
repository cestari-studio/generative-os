# Supabase project configuration — generative-os
# Single source of truth for per-function JWT gateway decisions.
# Regression test: src/__tests__/supabase-functions-config.test.js

project_id = "ldjfjmihdvdmltrptngf"

# ---------------------------------------------------------------------------
# Authenticated user endpoints: the gateway validates the Supabase JWT before
# the request reaches the handler. Handlers still re-validate the user and
# tenant membership server-side (defense in depth).
# ---------------------------------------------------------------------------

[functions.passkey-auth]
verify_jwt = true

[functions.settings-cascade]
verify_jwt = true

[functions.vector-rag]
verify_jwt = true

[functions.pagbank-connect]
verify_jwt = true

[functions.pagbank-order]
verify_jwt = true

# ---------------------------------------------------------------------------
# PSP webhook: unauthenticated at the JWT gateway BY DESIGN — callers are the
# PagBank PSP, not users. Authenticity is enforced in-handler via ECDSA
# signature verification against PAGBANK_PUBLIC_KEY (fail-closed when the key
# is not configured). verify_jwt stays false ONLY for this endpoint.
# ---------------------------------------------------------------------------

[functions.pagbank-webhook]
verify_jwt = false
