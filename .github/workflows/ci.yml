name: CI

on:
  push:
    branches:
      - main
      - beta
      - alpha
      - preview-homologation
      - ui-rebuild-carbon
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - beta
      - alpha

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Supabase public configuration for tests/builds. These are the publishable
# (browser-safe) project coordinates — not secrets. Override per environment
# via repository/environment variables; never put service-role keys here.
env:
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://ldjfjmihdvdmltrptngf.supabase.co' }}
  VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_placeholder_for_ci' }}

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (lockfile is authoritative)
        run: npm ci

      - name: Check for whitespace errors and merge markers
        run: git diff --check

      - name: Verify copyright headers
        run: npm run copyright:check

      - name: Run linters (ESLint, Stylelint, Prettier --check, CSpell)
        run: npm run lint

      - name: Product branding & hardcoded-content gate
        run: npm run check:branding

      - name: Ontology/route matrix consistency gate
        run: npm run check:matrices

      - name: Carbon component-pattern conformance gate
        run: npm run check:carbon-patterns

      - name: Spec Control Plane — deterministic generation gate
        run: npm run spec:check

      - name: Build client and SSR bundles
        run: npm run build

      - name: Run unit and integration tests with coverage
        env:
          # Opt in the catalog adapter integration tests against the ephemeral
          # postgres:17 service above. The guard requires both flags plus a
          # loopback host; it refuses remote targets and system databases.
          CATALOG_TEST_ENABLE: '1'
          CATALOG_TEST_ALLOW_RECREATE: '1'
          CATALOG_TEST_DATABASE: catalog_adapter_it
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test

      - name: Assert catalog integration tests ran (7 passed, 0 skipped)
        env:
          CATALOG_TEST_ENABLE: '1'
          CATALOG_TEST_ALLOW_RECREATE: '1'
          CATALOG_TEST_DATABASE: catalog_adapter_it
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          # Run ONLY the catalog integration file with the JSON reporter and
          # assert exact counts: a skip here must fail the gate, not pass.
          npx vitest run src/__tests__/catalog-adapter-integration.test.mjs \
            --reporter=json --outputFile=catalog-it-results.json
          node -e "
            const r = require('./catalog-it-results.json');
            const total = r.numTotalTests ?? 0;
            const passed = r.numPassedTests ?? 0;
            const skipped = (r.numPendingTests ?? 0) + (r.numTodoTests ?? 0);
            console.log(\`catalog integration: total=\${total} passed=\${passed} skipped=\${skipped}\`);
            if (total !== 7 || passed !== 7 || skipped !== 0) {
              console.error('FAIL: expected 7 passed / 0 skipped in catalog integration tests');
              process.exit(1);
            }
          "

      - name: Verify no gate mutated the worktree
        run: git diff --exit-code

  ssr-smoke:
    name: ssr-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Use Node.js from .nvmrc
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (lockfile is authoritative)
        run: npm ci

      - name: Build production SSR & client bundles
        run: npm run build

      - name: Start production SSR server and verify routes render server-side
        run: |
          set -euo pipefail
          PORT=5173 npm run preview:prod > ssr-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:5173/; then
              break
            fi
            sleep 1
          done

          # Warm up every route once before asserting: the first SSR request on
          # a cold runner triggers Vite dep optimization and lazy-bundle loads
          # (the /settings and /dashboard chunks are the heaviest in the app),
          # which can take tens of seconds on shared runners. Warmup is
          # best-effort; the assertion below enforces the real contract.
          for route in / /dashboard /settings /knowledge; do
            curl -s -o /dev/null --max-time 60 -H 'Accept-Language: en' "http://localhost:5173${route}" || true
          done

          check_route() {
            local route="$1"
            local expected="$2"
            local html=""
            local attempt
            # The first SSR request on a cold runner can exceed 10s while Vite
            # optimizes deps (large lazy bundles like /dashboard). Retry with a
            # longer budget before declaring a content failure — the check
            # still fails on genuine SSR errors and missing content.
            for attempt in 1 2 3; do
              html=$(curl --fail --silent --show-error --max-time 25 -H 'Accept-Language: en' "http://localhost:5173${route}" || true)
              if [ -n "$html" ]; then
                break
              fi
              sleep 2
            done
            if [ -z "$html" ]; then
              echo "FAIL: ${route} did not return a successful response after retries."
              exit 1
            fi
            # React client-render fallback marker: an empty #root means SSR failed silently.
            if printf '%s' "$html" | grep -q '<div id="root"></div>'; then
              echo "FAIL: ${route} returned an empty #root (React fell back to client rendering)."
              exit 1
            fi
            # Vite/SSR streaming errors must fail the gate even on HTTP 200.
            if printf '%s' "$html" | grep -qiE 'Streaming error|Named export .* not found'; then
              echo "FAIL: ${route} contains an SSR error marker."
              exit 1
            fi
            if ! printf '%s' "$html" | grep -q "$expected"; then
              echo "FAIL: ${route} is missing expected server-rendered content: ${expected}"
              exit 1
            fi
            echo "OK: ${route} rendered server-side with expected content."
          }

          check_route "/" "Cestari Studio"
          check_route "/dashboard" "Tenant Dashboard"
          check_route "/settings" "Multi-Tenant Cascade Settings"
          check_route "/knowledge" "Knowledge Base"

          # The server log must not contain render exceptions.
          if grep -qiE 'Streaming error|Named export .* not found' ssr-server.log; then
            echo "FAIL: SSR server log contains render errors:"
            grep -iE 'Streaming error|Named export .* not found' ssr-server.log
            exit 1
          fi
          echo "All SSR routes verified successfully."

      - name: Upload SSR server log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ssr-server-log
          path: ssr-server.log
          retention-days: 7

  billing-sql:
    name: billing-sql
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Install PostgreSQL client
        run: |
          if ! command -v psql > /dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi
          psql --version

      - name: Run billing SQL tests (authenticated role, RLS enforced)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:billing-sql

      - name: Run workspace management SQL tests (authenticated role, RLS enforced)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:workspace-sql

      - name: Run notifications foundation SQL tests (authenticated role, RLS enforced)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:notifications-sql

      - name: Run Phase 2 normative catalog + web surface SQL tests (candidate migrations, RLS enforced)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:phase2-sql

      - name: Run org-hierarchy SECURITY DEFINER SQL tests (authenticated role, RLS enforced)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:org-hierarchy-sql

      - name: Run journey-ledger SQL tests (authenticated role, RLS enforced)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:journey-ledger-sql

      - name: Run pagbank service_role-only grant SQL tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:pagbank-grants-sql

      - name: Run RPC grants (no-anon) SQL tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:rpc-grants-sql

      - name: Run safe-provisioning (takeover-safe) SQL tests
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
        run: npm run test:provision-tenant-sql

  browser-smoke:
    name: browser-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: quality
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Use Node.js from .nvmrc
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (lockfile is authoritative)
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run local browser functional smoke (hydration, gates, no demo content)
        run: npm run test:browser-smoke

      - name: Run axe accessibility audit (critical/serious violations fail)
        run: npm run test:axe

      - name: Upload axe results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: axe-results
          path: docs/ui-rebuild/axe/
          retention-days: 7

      - name: Run LAB performance benchmark with regression budgets
        run: npm run test:benchmark

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: docs/ui-rebuild/benchmark/
          retention-days: 7

  release-dry-run:
    name: release-dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - name: Checkout repository
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (lockfile is authoritative)
        run: npm ci

      - name: Verify release tooling can analyze and generate notes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release --dry-run
