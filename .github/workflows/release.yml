name: Release

on:
  push:
    branches:
      - main
      - beta
      - alpha

# Baseline: read-only. Write permissions are granted only to the release job.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Quality gates (CI) run on the same push event; branch protection must
    # require them before merge, so this job consumes an already-validated SHA.
    permissions:
      contents: write # tag, CHANGELOG commit and GitHub Release
      issues: write # @semantic-release/github comments on released issues
      pull-requests: write # @semantic-release/github comments on released PRs
    steps:
      - name: Checkout
        # actions/checkout v4.2.2
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Use Node.js from .nvmrc
        # actions/setup-node v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies (lockfile is authoritative)
        run: npm ci

      - name: Verify the integrity of provenance attestations and registry signatures
        run: npm audit signatures

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
