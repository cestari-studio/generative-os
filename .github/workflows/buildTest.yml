name: Generative OS CI (Build, Lint & Test)

on:
  push:
    branches: [main, beta, alpha]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  run-defined-frontend-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify copyright headers
        run: npm run copyright:check

      - name: Run linters (ESLint, Stylelint, Prettier, CSpell)
        run: npm run lint

      - name: Build client and SSR bundles
        run: npm run build

      - name: Run unit and integration tests with coverage
        run: npm run test
