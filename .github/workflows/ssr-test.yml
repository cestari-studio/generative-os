name: SSR Verification

on:
  push:
    branches: [main, beta, alpha]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ssr-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production SSR & client bundles
        run: npm run build

      - name: Start production SSR server and verify routes
        run: |
          PORT=5173 npm run preview:prod &
          SERVER_PID=$!
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:5173/; then
              break
            fi
            sleep 1
          done
          ROOT_HTML=$(curl -s -H 'Accept-Language: en' http://localhost:5173/)
          DASHBOARD_HTML=$(curl -s -H 'Accept-Language: en' http://localhost:5173/dashboard)
          SETTINGS_HTML=$(curl -s -H 'Accept-Language: en' http://localhost:5173/settings)
          KNOWLEDGE_HTML=$(curl -s -H 'Accept-Language: en' http://localhost:5173/knowledge)
          kill $SERVER_PID 2>/dev/null || true

          echo "$ROOT_HTML" | grep -q 'Generative OS'
          echo "$DASHBOARD_HTML" | grep -q 'Effective Cascade Governance'
          echo "$SETTINGS_HTML" | grep -q 'Multi-Tenant Cascade Settings'
          echo "$KNOWLEDGE_HTML" | grep -q 'Knowledge Base & pgvector RAG'
          echo "All SSR routes verified successfully."
